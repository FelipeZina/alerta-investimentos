[project]
name = "alerta"
version = "0.1.0"
description = "Alertas de variação de ações da B3 no Telegram, usando a API brapi.dev"
readme = "README.md"
authors = [
    { name = "FelipeZina", email = "felipezina2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

# ---- Ferramentas de desenvolvimento ----

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = erros básicos, I = ordenação de imports, UP = sintaxe moderna,
# B = bugs comuns, SIM = simplificações
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
